plugins {
    id 'com.android.application'
}

// The native libraries are built outside Gradle (quest/tools/build_quest_apk.sh: CMake + NDK) and
// staged into build/stage/{jniLibs,assets} by quest/tools/stage_apk.py; Gradle only packages and
// signs. The APK contains no game data: the user copies their own disc files to the headset.
android {
    namespace 'online.portroyale.gt4vr'
    compileSdk 34

    defaultConfig {
        applicationId 'online.portroyale.gt4vr'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [rootProject.file("build/stage/jniLibs")]
            assets.srcDirs = [rootProject.file("build/stage/assets")]
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
        doNotStrip '**/*.so' // stripped by stage_apk.py already
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
