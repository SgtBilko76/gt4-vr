plugins {
    id 'com.android.application'
}

// The native libraries are built outside Gradle (quest/tools/build_quest_apk.sh: CMake + NDK) and
// staged into build/stage/{jniLibs,assets} by quest/tools/stage_apk.py; Gradle only packages and
// signs. The APK contains no game data: the user copies their own disc files to the headset.
android {
    namespace 'online.portroyale.gt4vr'
    compileSdk 34

    defaultConfig {
        // quest/tools/build_quest.sh GAME=gt4r: the retail LAN build installs next to A-Spec II.
        applicationId project.findProperty('gtAppId') ?: 'online.portroyale.gt4vr'
        manifestPlaceholders = [appLabel: project.findProperty('gtAppLabel') ?: 'GT4 VR']
        minSdk 29
        targetSdk 32
        // Private A-Spec II release 0.1.0-beta (owner 2026-11-02): no public download.
        versionCode((project.findProperty('gtVersionCode') ?: '2') as int)
        versionName project.findProperty('gtVersionName') ?: '0.1.0-beta'
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [rootProject.file("build/stage/jniLibs")]
            assets.srcDirs = [rootProject.file("build/stage/assets")]
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
        doNotStrip '**/*.so' // stripped by stage_apk.py already
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
