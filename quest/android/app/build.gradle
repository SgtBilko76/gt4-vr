plugins {
    id 'com.android.application'
}

// The native libraries are built outside Gradle (quest/tools/build_quest_apk.sh: CMake + NDK) and
// staged into build/stage/{jniLibs,assets} by quest/tools/stage_apk.py; Gradle only packages and
// signs. The APK contains no game data: the user copies their own disc files to the headset.
android {
    namespace 'online.portroyale.gt4vr'
    compileSdk 34

    defaultConfig {
        // quest/tools/build_quest.sh GAME=gt4r: the retail LAN build installs next to A-Spec II.
        applicationId project.findProperty('gtAppId') ?: 'online.portroyale.gt4vr'
        // gtLauncher: which entry the app library shows - specii / online (that version's game starts
        // directly) or selector (the combined app's 2D version picker).
        def launcher = project.findProperty('gtLauncher') ?: 'specii'
        // App icon per app (owner 2026-11-10): GT4 logo with "spec-II" for Spec II, without it for Online.
        // The official GT4 logo is Sony's trademark: fine for the private builds only.
        manifestPlaceholders = [appLabel: project.findProperty('gtAppLabel') ?: 'Gran Turismo 4 Spec II 3D/VR',
                                appIcon: launcher == 'online' ? 'ic_launcher_online' : 'ic_launcher_specii',
                                selectorEnabled: (launcher == 'selector').toString(),
                                speciiLauncher: (launcher == 'specii').toString(),
                                onlineLauncher: (launcher == 'online').toString()]
        minSdk 29
        targetSdk 32
        // Private A-Spec II release 0.1.0-beta (owner 2026-11-02): no public download.
        versionCode((project.findProperty('gtVersionCode') ?: '10') as int)
        versionName project.findProperty('gtVersionName') ?: '0.3.1-beta'
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [rootProject.file("build/stage/jniLibs")]
            assets.srcDirs = [rootProject.file("build/stage/assets")]
        }
    }

    // Texture bundles (.bin) are stored, so the app can read each texture at its offset directly.
    androidResources {
        noCompress 'png', 'dds', 'bin'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
        doNotStrip '**/*.so' // stripped by stage_apk.py already
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
